name: EmptyStateKitDemo
options:
  bundleIdPrefix: io.github.halilozel1903
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
packages:
  EmptyStateKit:
    path: ..
targets:
  StatesMac:
    type: application
    platform: macOS
    sources:
      - Shared
      - Mac
    dependencies:
      - package: EmptyStateKit
        product: EmptyStateKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.halilozel1903.StatesMac
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Empty States
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Halil Özel"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_IDENTITY: "-"
  StatesPhone:
    type: application
    platform: iOS
    sources:
      - Shared
      - Phone
    dependencies:
      - package: EmptyStateKit
        product: EmptyStateKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.halilozel1903.StatesPhone
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Empty States
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  StatesMac:
    build:
      targets:
        StatesMac: all
    run:
      config: Debug
  StatesPhone:
    build:
      targets:
        StatesPhone: all
    run:
      config: Debug
